# Identificador único do projeto no SonarQube (DEVE ser igual ao criado no painel)
sonar.host.url=http://localhost:9000
sonar.projectKey=go-basics
sonar.projectName=go-basics
sonar.projectVersion=1.0

# Onde está o código-fonte
sonar.sources=.
sonar.language=go


# Excluir arquivos de teste e dependências da análise principal
sonar.exclusions=**/*_test.go, **/vendor/**

# Incluir arquivos de teste na análise
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Apontar para o relatório de cobertura gerado pelo Go
sonar.go.coverage.reportPaths=coverage.out